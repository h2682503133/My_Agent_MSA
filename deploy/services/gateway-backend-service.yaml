apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-backend-service
  namespace: agent
  labels:
    app: gateway-backend-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-backend-service
  template:
    metadata:
      labels:
        app: gateway-backend-service
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      containers:
        - name: gateway-backend-service
          image: agent/gateway-backend-service:v41
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5210
            # 整站反代：端口沿用各自服务的原号（admin_proxy.py）
            - name: llbot-webui
              containerPort: 3080
            - name: dashboard-panel
              containerPort: 5700
          env:
            - name: SCHEDULER_CLIENT_MODE
              value: "grpc"
            - name: SCHEDULER_GRPC_TARGET
              value: "task-scheduler-service.agent.svc.cluster.local:5100"
            - name: SUBSCRIBER_ID
              value: "web-gateway-1"
            - name: USER_WHITELIST
              value: ""
            - name: ASSETS_DIR
              value: "/app/assets"
            # 离线兜底缓冲：每用户最多缓存条数与保留秒数，TTL=0 表示不按时间过期
            - name: OFFLINE_BUFFER_MAX
              value: "50"
            - name: OFFLINE_BUFFER_TTL
              value: "0"
            # 离线转投其它渠道的单次尝试超时（秒）
            - name: OFFLINE_FORWARD_TIMEOUT
              value: "8"
          volumeMounts:
            - name: assets
              mountPath: /app/assets
      volumes:
        - name: assets
          persistentVolumeClaim:
            claimName: my-agent-assets-pvc
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-backend-service
  namespace: agent
  labels:
    app: gateway-backend-service
spec:
  type: ClusterIP
  selector:
    app: gateway-backend-service
  ports:
    - name: http
      port: 5210
      targetPort: 5210
    - name: llbot-webui
      port: 3080
      targetPort: 3080
    - name: dashboard-panel
      port: 5700
      targetPort: 5700
