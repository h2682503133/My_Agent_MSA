apiVersion: apps/v1
kind: Deployment
metadata:
  name: qq-llbot-service
  namespace: agent
  labels:
    app: qq-llbot-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qq-llbot-service
  template:
    metadata:
      labels:
        app: qq-llbot-service
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      dnsConfig:
        nameservers:
          - 223.5.5.5
          - 119.29.29.29
        searches:
          - agent.svc.cluster.local
          - svc.cluster.local
          - cluster.local
        options:
          - name: ndots
            value: "2"
          - name: timeout
            value: "2"
          - name: attempts
            value: "3"
      containers:
        - name: qq-llbot-service
          image: agent/qq-llbot-service:v15
          imagePullPolicy: Always
          env:
            - name: QQ_LLBOT_CONFIG_PATH
              value: "/service/config/qq_llbot_config.json"
            - name: SCHEDULER_TARGET
              value: "task-scheduler-service.agent.svc.cluster.local:5100"
            - name: SATORI_HOST
              value: "host.docker.internal"
            - name: SATORI_PORT
              value: "5600"
            - name: SATORI_TOKEN
              value: ""
            - name: SUBSCRIBER_ID
              value: "qq-llbot-1"
            # 同渠道多订阅者的优先级（数值大者优先）：llbot 优先，qqofficial 兜底
            - name: SUBSCRIBER_PRIORITY
              value: "100"
            # 连续多少次用户可见发送失败即判定掉线 → 主动退订事件流（不用心跳）
            - name: OFFLINE_SEND_FAILURES
              value: "3"
          volumeMounts:
            - name: my-agent-config
              mountPath: /service/config
              subPath: qq-llbot
            - name: my-agent-workspace
              mountPath: /app/workspace
      volumes:
        - name: my-agent-config
          persistentVolumeClaim:
            claimName: my-agent-config-pvc
        - name: my-agent-workspace
          persistentVolumeClaim:
            claimName: my-agent-workspace-pvc
