apiVersion: apps/v1
kind: Deployment
metadata:
  name: openviking-context-service
  namespace: agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openviking-context-service
  template:
    metadata:
      labels:
        app: openviking-context-service
    spec:
      containers:
        - name: openviking-context-service
          image: agent/openviking-context-service:v27
          imagePullPolicy: Always
          ports:
            - containerPort: 5301
          env:
            - name: OPENVIKING_CONTEXT_GRPC_PORT
              value: "5301"
            - name: OPENVIKING_BACKEND
              value: "server"
            - name: OPENVIKING_SERVER_URL
              value: "http://openviking.agent.svc.cluster.local:1933"
            - name: OPENVIKING_API_KEY
              value: "/app/config/openviking/api_key"
            - name: OPENVIKING_ROOT_API_KEY
              value: "/app/config/openviking/root_api_key"
            - name: OPENVIKING_ACCOUNT
              value: "my-agent"
            - name: OPENVIKING_ACCOUNT_MODE
              value: "fixed"
            - name: OPENVIKING_FILE_FALLBACK
              value: "false"
            - name: USER_SERVICE_URL
              value: "http://user-service.agent.svc.cluster.local:5204"
            - name: MOCK_VIKING
              value: "false"
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: my-agent-config-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: openviking-context-service
  namespace: agent
spec:
  selector:
    app: openviking-context-service
  ports:
    - name: grpc
      port: 5301
      targetPort: 5301
  type: ClusterIP
