apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-service
  namespace: agent
  labels:
    app: dashboard-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard-service
  template:
    metadata:
      labels:
        app: dashboard-service
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: dashboard-sa
      containers:
        - name: dashboard-service
          image: docker.io/agent/dashboard-service:v16
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5700
          env:
            - name: CONFIG_ROOT
              value: "/app/config"
            - name: NAMESPACE
              value: "agent"
            - name: SESSION_ROOT
              value: "/app/session-data/workspace/viking/my-agent/user"
            - name: OPENVIKING_SERVER_URL
              value: "http://openviking.agent.svc.cluster.local:1933"
            - name: USER_SERVICE_URL
              value: "http://user-service.agent.svc.cluster.local:5204"
            - name: OPENVIKING_API_KEY
              value: "/app/config/openviking/api_key"
          volumeMounts:
            - name: my-agent-config
              mountPath: /app/config
            - name: my-agent-session
              mountPath: /app/session-data
      volumes:
        - name: my-agent-config
          persistentVolumeClaim:
            claimName: my-agent-config-pvc
        - name: my-agent-session
          persistentVolumeClaim:
            claimName: my-agent-openviking-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard-service
  namespace: agent
  labels:
    app: dashboard-service
spec:
  type: ClusterIP
  selector:
    app: dashboard-service
  ports:
    - name: http
      port: 5700
      targetPort: 5700
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dashboard-sa
  namespace: agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dashboard-role
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "endpoints", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dashboard-binding
subjects:
  - kind: ServiceAccount
    name: dashboard-sa
    namespace: agent
roleRef:
  kind: ClusterRole
  name: dashboard-role
  apiGroup: rbac.authorization.k8s.io
