apiVersion: apps/v1
kind: Deployment
metadata:
  name: openviking
  namespace: agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openviking
  template:
    metadata:
      labels:
        app: openviking
      annotations:
        sidecar.istio.io/inject: 'false'
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values: ["desktop-worker"]
      containers:
      - name: openviking
        image: ghcr.io/volcengine/openviking:v0.5.3
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 1933
        env:
        - name: OPENVIKING_CONFIG_FILE
          value: /etc/openviking/ov.conf
        # 0.5.x 镜像默认会拉起 vikingbot 网关（--with-bot），我们不跑 bot，直接起 server
        - name: OPENVIKING_WITH_BOT
          value: "0"
        volumeMounts:
        - name: config
          mountPath: /etc/openviking/ov.conf
          subPath: openviking/ov.conf
          readOnly: true
        - name: data
          mountPath: /data/openviking
        - name: store-local
          mountPath: /data/openviking/workspace/vectordb/context/store
        livenessProbe:
          httpGet:
            path: /health
            port: 1933
          initialDelaySeconds: 20
          periodSeconds: 20
        command:
        - /bin/sh
        - -c
        args:
        # 0.5.3 起 index_manage 的 add_job 已包在 try/except 里（不再因 misfire_grace_time 崩启动），
        # 所以 0.4.10 时代给 local_collection.py 打的那个补丁不再需要。
        - 'exec openviking-server'
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: my-agent-config-pvc
      - name: data
        persistentVolumeClaim:
          claimName: my-agent-openviking-pvc
      - name: store-local
        hostPath:
          path: /var/lib/openviking/store
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: openviking
  namespace: agent
spec:
  selector:
    app: openviking
  ports:
  - name: http
    port: 1933
    targetPort: 1933
  type: ClusterIP
