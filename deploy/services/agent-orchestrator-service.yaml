apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-orchestrator-service
  namespace: agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-orchestrator-service
  template:
    metadata:
      labels:
        app: agent-orchestrator-service
    spec:
      containers:
      - name: agent-orchestrator-service
        image: agent/agent-orchestrator-service:v95
        imagePullPolicy: Always
        ports:
        - containerPort: 5300
        env:
        - name: ORCHESTRATOR_GRPC_PORT
          value: "5300"
        - name: OPENVIKING_CONTEXT_TARGET
          value: "openviking-context-service:5301"
        - name: MODEL_PROXY_TARGET
          value: "model-proxy-service:5302"
        - name: TOOL_RUNTIME_TARGET
          value: "tool-runtime-service:5303"
        - name: AGENT_CONFIG_PATH
          value: "/app/config/agent_list.json"
        - name: SYSTEM_PROMPT_DIR
          value: "/app/system_prompt"
        - name: PROCESS_DIR
          value: "/app/config/process"
        - name: MAX_AGENT_STEPS
          value: "30"
        # 用户工作区（与 tool-runtime 同一个 PVC）：带图消息的图片由 orchestrator
        # 自动落盘到 users/<user_id>/uploads/images/<日期>/，tool-runtime 的
        # image-view 再从同一路径读回来给模型看。两边的 WORKSPACE_DIR 必须一致。
        - name: WORKSPACE_DIR
          value: "/app/workspace"
        volumeMounts:
        - name: my-agent-config
          mountPath: /app/config
          subPath: orchestrator/config
        - name: my-agent-config
          mountPath: /app/system_prompt
          subPath: orchestrator/system_prompt
        - name: my-agent-workspace
          mountPath: /app/workspace
      volumes:
      - name: my-agent-config
        persistentVolumeClaim:
          claimName: my-agent-config-pvc
      - name: my-agent-workspace
        persistentVolumeClaim:
          claimName: my-agent-workspace-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: agent-orchestrator-service
  namespace: agent
spec:
  selector:
    app: agent-orchestrator-service
  ports:
  - name: grpc
    port: 5300
    targetPort: 5300
  type: ClusterIP
