syntax = "proto3";

package agent_orchestrator.v1;

message ExecuteTaskRequest {
  string task_id = 1;
  string user_id = 2;
  string session_id = 3;
  string channel = 4;
  string content = 5;
  string created_at = 6;
  map<string, string> metadata = 7;
  string agent_id = 8;
  repeated string images = 9;
}

message ResumeTaskRequest {
  string task_id = 1;
  string user_id = 2;
  string session_id = 3;
  string channel = 4;
  string content = 5;
  string created_at = 6;
  map<string, string> metadata = 7;
  string agent_id = 8;
  repeated string images = 9;
}

// 打断（barge-in）：让某用户当前「正在跑」的任务在下一个检查点暂停，**保留现场**
// （上下文栈 / tool_log / 记忆一律不动），等用户下一条消息作为【用户插话】接着跑。
// 语义是暂停，不是销毁：任务留在 orchestrator 的 PENDING_TASKS 里等待 ResumeTask。
message SetSessionStateRequest {
  string user_id = 1;
  string session_id = 2;
  string agent_id = 3;   // 非空 = 切换智能体
  string mode = 4;       // 非空 = 切换模式（"default" = 回默认）
}

message SetSessionStateResponse {
  bool ok = 1;
  string message = 2;    // 给用户看的回执
  string error = 3;
}

message StopTaskRequest {
  string user_id = 1;
  // 精确指定任务；空 = 该用户当前运行中的任务（约定一用户同时只有一个）。
  string task_id = 2;
  string reason = 3;   // 仅用于日志
}

message StopTaskResponse {
  bool ok = 1;
  // 是否定位到了运行中的任务并已发出暂停请求。false = 当时没有任务在跑
  // （已结束或本来就空闲）——调用方据此区分「已请求暂停」与「无需暂停」。
  bool stopped = 2;
  string message = 3;
}

message DeliveryTarget {
  string channel = 1;
  string user_id = 2;
  string conversation_id = 3;
  string reply_to = 4;
}

message TaskEvent {
  string event_id = 1;
  string task_id = 2;
  string user_id = 3;
  string session_id = 4;
  string channel = 5;
  string type = 6;
  string text = 7;
  repeated string images = 8;
  int32 waiting = 9;
  string error = 10;
  DeliveryTarget delivery_target = 11;
  map<string, string> metadata = 12;
}

service AgentOrchestrator {
  rpc ExecuteTask(ExecuteTaskRequest) returns (stream TaskEvent);
  rpc ResumeTask(ResumeTaskRequest) returns (stream TaskEvent);
  rpc StopTask(StopTaskRequest) returns (StopTaskResponse);
  // 会话状态（斜杠命令 /agent、/mode）：只改内存里的 default_agent / default_mode
  rpc SetSessionState(SetSessionStateRequest) returns (SetSessionStateResponse);
}
