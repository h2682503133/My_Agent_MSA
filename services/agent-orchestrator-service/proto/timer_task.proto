syntax = "proto3";

package timer_task.v1;

message CreateTimerTaskRequest {
  string user_id = 1;
  string channel_id = 2;
  string session_id = 3;
  double trigger_timestamp = 4;
  string content = 5;
  string task_type = 6;
  string client_message_id = 7;
  string agent_id = 8;
  // 灵活时间描述（优先于 trigger_timestamp）：
  // 第4参「开始时间」：绝对/当天/相对/区间随机，空=立即，也可写 现在/立即
  string time_str = 9;
  // 重复计划 JSON（可选，一般由服务端从 repeat_str 解析生成）
  string schedule = 10;
  // 第5参「重复计划」（可选）：空/0/无=不重复；每30分钟/每5-10分钟=间隔重复
  string repeat_str = 11;
}

message CreateTimerTaskResponse {
  bool ok = 1;
  string task_id = 2;
  string message = 3;
}

message ListUserTasksRequest {
  string user_id = 1;
}

message TimerTaskInfo {
  string task_id = 1;
  string user_id = 2;
  string channel_id = 3;
  string session_id = 4;
  double trigger_time = 5;
  string trigger_time_str = 6;
  string content = 7;
  string task_type = 8;
  string client_message_id = 9;
  string agent_id = 10;
  string created_at = 11;
  // 重复计划人类可读描述（如 每天10:00 / 每30分钟），一次性任务为空
  string schedule_str = 12;
  // 重复计划 JSON
  string schedule = 13;
}

message ListUserTasksResponse {
  repeated TimerTaskInfo tasks = 1;
}

message DeleteUserTaskRequest {
  string user_id = 1;
  string task_id = 2;
}

message DeleteUserTaskResponse {
  bool ok = 1;
  string message = 2;
}

service TimerTask {
  rpc CreateTimerTask(CreateTimerTaskRequest) returns (CreateTimerTaskResponse);
  rpc ListUserTasks(ListUserTasksRequest) returns (ListUserTasksResponse);
  rpc DeleteUserTask(DeleteUserTaskRequest) returns (DeleteUserTaskResponse);
}
