syntax = "proto3";

package tool_runtime.v1;

message ExecuteToolRequest {
  string task_id = 1;
  string tool_name = 2;
  string skill_name = 3;
  repeated string args = 4;
  map<string, string> kwargs = 5;
  string workspace_dir = 6;
  int32 timeout_seconds = 7;
}

message Artifact {
  string type = 1;
  string local_path = 2;
  string asset_url = 3;
}

// 工具执行过程中由 tool-runtime 推送给调用方的事件流：
//  - message: 执行过程中向用户推送的文本消息（即时送达）
//  - image:   执行过程中向用户推送的图片（即时送达）
//  - done:    工具执行结束，携带最终 output/artifacts（最后一个事件）
message ExecuteToolEvent {
  string event_type = 1;
  string text = 2;
  Artifact artifact = 3;
  string output = 4;
  repeated Artifact artifacts = 5;
  string logs = 6;
  string error = 7;
}

service ToolRuntime {
  rpc ExecuteTool(ExecuteToolRequest) returns (stream ExecuteToolEvent);
}
