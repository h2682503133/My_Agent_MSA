<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>
    if (window.innerWidth <= 768) { window.location.href = '/chat-mobile.html'; }
  </script>
  <title>智能体对话</title>

  
  <link rel="stylesheet" href="chat.css" />
</head>
<body>
  <div class="app" id="app">
    <!-- ═══ Sidebar ═══ -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h2>智能体对话</h2>
        <span class="user-badge" id="user-badge">-</span>
      </div>
      <div class="sidebar-actions">
        <button onclick="showNewConvModal()">+ 新建对话</button>
      </div>
      <div class="conv-list" id="conv-list"></div>
      <div class="sidebar-footer">
        <span id="queue-status">排队：0</span>
        <button onclick="logout()">切换用户 / 退出</button>
      </div>
    </aside>

    <!-- ═══ Main Chat Area ═══ -->
    <main class="main-area" id="main-area">
      <div class="chat-header">
        <div class="agent-info">
          <span class="agent-name" id="current-agent-name">main</span>
          <span class="agent-id" id="current-agent-id">agent: main</span>
        </div>
        <div class="status-row">
          <span id="connection-status" class="status-offline">事件流：未连接</span>
          <button class="btn-sm outline" onclick="toggleRightPanel()" id="toggle-panel-btn">面板 ▸</button>
        </div>
      </div>

      <section id="chat-box">
        <div class="ws-empty">请选择一个对话开始</div>
      </section>

      <footer class="input-row">
        <div class="input-toolbar">
          <button type="button" class="attach-btn" id="attach-btn" title="发送图片">🖼</button>
          <input type="file" id="image-input" accept="image/*" multiple hidden />
          <div class="img-preview-list" id="img-preview-list"></div>
        </div>
        <textarea id="message-input" placeholder="输入消息，Enter 发送，Shift+Enter 换行" disabled></textarea>
        <button id="send-btn" class="send-btn" onclick="sendMessage()" disabled>发送</button>
      </footer>
    </main>

    <!-- ═══ Right Panel ═══ -->
    <aside class="right-panel" id="right-panel">
      <div class="panel-tabs" id="panel-tabs">
        <button class="panel-tab active" data-tab="user-settings">用户设置</button>
        <button class="panel-tab" data-tab="workspace">工作空间</button>
        <button class="panel-tab" data-tab="logs">日志</button>
      </div>
      <div class="panel-body" id="panel-body">
        <!-- User Settings -->
        <div class="tab-content active" id="tab-user-settings">
          <div class="setting-section">
            <h4>用户信息</h4>
            <div class="setting-row"><label>用户 ID</label><span id="profile-user-id">-</span></div>
            <div class="setting-row"><label>渠道数</label><span id="profile-channel-count">0</span></div>
          </div>
          <div class="setting-section">
            <h4>渠道绑定</h4>
            <div class="channel-list" id="channel-list"><div class="ws-empty">暂无绑定渠道</div></div>
            <div class="add-channel-row">
              <select id="new-channel-type">
                <option value="qq">QQ</option>
                <option value="wechat">微信</option>
                <option value="web">Web</option>
                <option value="custom">自定义</option>
              </select>
              <input id="new-channel-uid" placeholder="渠道用户ID" />
              <button class="btn-sm" onclick="bindChannel()">绑定</button>
            </div>
          </div>
        </div>

        <!-- Workspace -->
        <div class="tab-content" id="tab-workspace">
          <div class="ws-toolbar">
            <input id="ws-path-input" placeholder="/app/workspace/users/..." value="/" />
            <button class="btn-sm" onclick="loadWorkspaceFiles()">浏览</button>
            <button class="btn-sm" onclick="document.getElementById('ws-file-input').click()">上传文件</button>
            <button class="btn-sm outline" onclick="document.getElementById('ws-folder-input').click()">上传文件夹</button>
            <input type="file" id="ws-file-input" multiple style="display:none" />
            <input type="file" id="ws-folder-input" webkitdirectory multiple style="display:none" />
          </div>
          <div class="ws-tree" id="ws-tree"><div class="ws-empty">输入路径后点击浏览</div></div>
          <div class="ws-preview" id="ws-preview"><div class="ws-empty">选择文件查看内容</div></div>
        </div>

        <!-- Logs -->
        <div class="tab-content" id="tab-logs">
          <div class="log-toolbar">
            <input id="log-filter" placeholder="过滤关键字" />
            <button class="btn-sm" onclick="loadLogs()">刷新</button>
            <button class="btn-sm outline" onclick="startLogAutoRefresh()">自动</button>
          </div>
          <div class="log-content" id="log-content"><div class="log-empty">点击刷新加载日志</div></div>
        </div>
      </div>
    </aside>
  </div>

  <!-- ═══ New Conversation Modal ═══ -->
  <div class="modal-overlay hidden" id="new-conv-modal">
    <div class="modal-card">
      <h3>新建对话</h3>
      <label for="new-agent-id">智能体 ID (agent_id)</label>
      <input id="new-agent-id" type="text" placeholder="例如：main、tool、..." value="main" />
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeNewConvModal()">取消</button>
        <button class="btn-confirm" onclick="confirmNewConv()">创建</button>
      </div>
    </div>
  </div>

  <script src="chat.js"></script>
  <!-- 背景图轮换 -->
  <div class="bg-rotator" id="bg-rotator"></div>
  <style>
    .bg-rotator {
      position: fixed; inset: 0; z-index: 50;
      background-size: cover; background-position: center; background-repeat: no-repeat;
      opacity: 0.2; pointer-events: none;
    }
  </style>
  <script>
    (function () {
      var BG_ROOT = '/backgrounds/';
      var BG_INTERVAL = 5 * 60 * 1000;
      var list = [], index = 0, el = null;
      function setBg(url) {
        if (!el) el = document.getElementById('bg-rotator');
        if (el) el.style.backgroundImage = 'url("' + url + '")';
      }
      function preload(url) { var img = new Image(); img.src = url; }
      function next() {
        if (!list.length) return;
        setBg(BG_ROOT + list[index % list.length]);
        index += 1;
        preload(BG_ROOT + list[index % list.length]);
      }
      function safeName(f) {
        var n = f.name;
        try { n = decodeURIComponent(n); } catch (e) {}
        return n;
      }
      fetch(BG_ROOT)
        .then(function (r) { return r.json(); })
        .then(function (data) {
          list = (data || []).map(safeName)
            .filter(function (n) { return /\.(jpe?g|png|webp)$/i.test(n); });
          if (!list.length) return;
          next();
          setInterval(next, BG_INTERVAL);
        })
        .catch(function () {});
    })();
  </script>
</body>
</html>
