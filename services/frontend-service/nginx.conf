server {
    listen 80;
    server_name _;

    # 图片以 base64 data URL 形式随消息提交，放宽请求体上限
    client_max_body_size 64m;

    root /usr/share/nginx/html;
    index login.html;

    location = / {
        return 302 /login.html;
    }

    location /api/events {
        proxy_pass http://gateway-backend-service:5210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    location /api/ {
        proxy_pass http://gateway-backend-service:5210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /login.html {
        try_files /login.html =404;
    }

    location /chat.html {
        try_files /chat.html =404;
    }

    location /chat-mobile.html {
        try_files /chat-mobile.html =404;
    }

    location /chat-mobile.css {
        try_files /chat-mobile.css =404;
    }

    # 背景图轮换：目录列表以 JSON 形式返回
    location /backgrounds/ {
        autoindex on;
        autoindex_format json;
    }

    location / {
        try_files $uri $uri/ /login.html;
    }
}
