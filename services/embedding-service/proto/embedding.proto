syntax = "proto3";

package embedding.v1;

// 向量计算服务的对外契约：业务侧只认这个口，不关心底层是 ollama / OpenAI / 本地模型。

message PingRequest {}

message PingResponse {
  bool ok = 1;
  string provider = 2;
  string model = 3;
  int32 dimension = 4;   // 已知维度；还没算过则为 0
  string error = 5;
}

message EmbedRequest {
  string request_id = 1;
  repeated string texts = 2;
  string model = 3;      // 留空用服务默认模型
}

message EmbeddingItem {
  int32 index = 1;
  repeated float vector = 2;
}

message EmbedResponse {
  bool ok = 1;
  repeated EmbeddingItem items = 2;
  string provider = 3;
  string model = 4;
  int32 dimension = 5;
  string error = 6;
}

service EmbeddingService {
  rpc Ping(PingRequest) returns (PingResponse);
  rpc Embed(EmbedRequest) returns (EmbedResponse);
}
