<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My_Agent Dashboard</title>
  <link rel="stylesheet" href="/assets/css/dashboard.css">
</head>
<body>

<!-- 登录遮罩 -->
<div id="login-overlay">
  <div class="login-box">
    <h2>🔐 Dashboard 登录</h2>
    <input type="password" id="login-pwd" placeholder="请输入密码" onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">登 录</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<!-- 密码修改弹窗 -->
<div id="pwd-modal" class="hidden">
  <div class="pwd-box">
    <h3>修改密码</h3>
    <input type="password" id="pwd-old" placeholder="旧密码">
    <input type="password" id="pwd-new" placeholder="新密码">
    <input type="password" id="pwd-confirm" placeholder="确认新密码">
    <div class="pwd-err" id="pwd-err"></div>
    <div class="pwd-actions">
      <button class="btn green" onclick="changePwd()" style="flex:1;">确认修改</button>
      <button class="btn" onclick="closePwdModal()" style="flex:1;">取消</button>
    </div>
  </div>
</div>

<header>
  <h1>⚙️ My_Agent Dashboard</h1>
  <nav>
    <button data-tab="pods" class="active">Pod 状态</button>
    <button data-tab="config">配置管理</button>
    <button data-tab="logs">日志查看</button>
    <button data-tab="sprompt">System Prompt</button>
    <button data-tab="worldinfo">世界书</button>
    <button data-tab="process">长期事件</button>
    <button data-tab="session">Session 管理</button>
    <button data-tab="qrcode">二维码</button>
    <button data-tab="misc">杂项</button>
  </nav>
  <div class="header-right">
    <span id="status" style="font-size:0.8rem;color:var(--dim);"></span>
    <button onclick="openPwdModal()">修改密码</button>
  </div>
</header>

<main>
  <!-- @include: tabs/pods.html -->

  <!-- @include: tabs/config.html -->

  <!-- @include: tabs/logs.html -->

  <!-- @include: tabs/sprompt.html -->

  <!-- @include: tabs/worldinfo.html -->

  <!-- @include: tabs/session.html -->

  <!-- @include: tabs/qrcode.html -->

  <!-- @include: tabs/misc.html -->
</main>

<script src="/assets/js/core.js"></script>
<script src="/assets/js/pods.js"></script>
<script src="/assets/js/config.js"></script>
<script src="/assets/js/logs.js"></script>
<script src="/assets/js/sprompt.js"></script>
<script src="/assets/js/tool_panel.js"></script>
<script src="/assets/js/worldinfo.js"></script>
<script src="/assets/js/process.js"></script>
<script src="/assets/js/session.js"></script>
<script src="/assets/js/qrcode.js"></script>
<script src="/assets/js/misc.js"></script>
<script src="/assets/js/init.js"></script>
</body>
</html>
