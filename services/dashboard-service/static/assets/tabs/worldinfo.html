<!-- 世界书管理 -->
<div id="tab-worldinfo" class="tab">
  <h2>世界书管理 <span style="font-size:0.8rem;color:var(--dim);">(orchestrator/config/world_info，按关键词触发注入)</span></h2>
  <div class="grid2">
    <div class="card">
      <h3>条目列表</h3>
      <div class="session-toolbar" style="margin-bottom:8px;">
        <span style="color:var(--dim);">筛选：</span>
        <select id="wi-filter" style="min-width:220px;" onchange="wiRender()"></select>
        <span id="wi-filter-count" style="color:var(--dim);font-size:0.8rem;"></span>
      </div>
      <div id="wi-list" style="max-height:520px;overflow-y:auto;"></div>
    </div>
    <div class="card">
      <h3 id="wi-form-title">添加条目</h3>
      <div style="margin-bottom:8px;">
        <label style="font-size:0.8rem;color:var(--dim);">scope（agent_id 或 group:群组id；空=main）</label>
        <input id="wi-scope" placeholder="main / group:核心组" style="width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);padding:6px;border-radius:4px;margin-top:4px;">
      </div>
      <div style="margin-bottom:8px;">
        <label style="font-size:0.8rem;color:var(--dim);">关键词（逗号分隔）</label>
        <input id="wi-keys" placeholder="王都,皇城" style="width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);padding:6px;border-radius:4px;margin-top:4px;">
      </div>
      <div style="margin-bottom:8px;">
        <label style="font-size:0.8rem;color:var(--dim);">排除例外（与 scope 作差；逗号分隔 agent_id 或 group:群组id，如 lilith,group:lust）</label>
        <input id="wi-exclude" placeholder="lilith,group:lust" style="width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);padding:6px;border-radius:4px;margin-top:4px;">
      </div>
      <div style="margin-bottom:8px;">
        <label style="font-size:0.8rem;color:var(--dim);">内容</label>
        <textarea id="wi-content" style="min-height:140px;margin-top:4px;" placeholder="世界设定内容..."></textarea>
      </div>
      <div style="display:flex;gap:14px;align-items:center;margin-bottom:12px;flex-wrap:wrap;font-size:0.85rem;">
        <label>优先级 <input id="wi-priority" type="number" value="0" style="width:64px;background:var(--bg);color:var(--text);border:1px solid var(--border);padding:4px 8px;border-radius:4px;"></label>
        <label style="display:flex;align-items:center;gap:4px;cursor:pointer;"><input id="wi-constant" type="checkbox"> 常驻</label>
        <label style="display:flex;align-items:center;gap:4px;cursor:pointer;"><input id="wi-regex" type="checkbox"> 正则</label>
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">匹配
          <span class="wi-mode-btn active" id="wi-mode-or" onclick="wiSetMode('or')">or 任一命中</span>
          <span class="wi-mode-btn" id="wi-mode-and" onclick="wiSetMode('and')">and 全部命中</span>
        </label>
        <label style="display:flex;align-items:center;gap:4px;cursor:pointer;"><input id="wi-enabled" type="checkbox" checked> 启用</label>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn green" onclick="wiSave()">保存</button>
        <button class="btn" onclick="wiResetForm()">清空</button>
      </div>
    </div>
  </div>
  <div class="card">
    <h3>群组映射（agent_id : 群组id，逗号分隔多个）</h3>
    <div id="wi-groups" style="display:flex;flex-direction:column;gap:6px;"></div>
    <div style="display:flex;gap:8px;margin-top:8px;">
      <button class="btn" onclick="wiAddGroupRow()">添加 agent</button>
      <button class="btn green" onclick="wiSaveGroups()">保存群组</button>
    </div>
  </div>
</div>
