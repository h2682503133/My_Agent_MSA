<!-- 二维码 -->
<div id="tab-qrcode" class="tab">
  <h2>LLBot 二维码</h2>
  <div class="card" style="text-align:center;padding:32px;">
    <img id="qrcode-img" src="/api/qrcode?t=0" alt="QR Code"
         style="max-width:300px;max-height:300px;border:1px solid var(--border);border-radius:8px;"
         onerror="this.style.display='none';document.getElementById('qrcode-placeholder').style.display='block';">
    <div id="qrcode-placeholder" style="display:none;padding:60px;color:var(--dim);">
      <p style="font-size:1.1rem;">暂无二维码</p>
      <p style="font-size:0.85rem;margin-top:8px;">请先在 LLBot 页面启动 Bot 并推送二维码</p>
    </div>
    <p id="qrcode-time" style="margin-top:16px;color:var(--dim);font-size:0.85rem;"></p>
  </div>
</div>
